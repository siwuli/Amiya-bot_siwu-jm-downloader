# siwu-jm-downloader 全局默认配置
# 控制台修改后会覆盖这里的默认值

# ============================
# 总开关
# ============================
jm_enabled: true

# ============================
# 压缩包密码
# ============================
# 是否给导出的 zip 添加密码（需要 pyzipper，已随插件打包）
jm_zip_password_enabled: false

# 自定义压缩包密码；留空则使用当前本子编号作为密码
jm_zip_password: ''
